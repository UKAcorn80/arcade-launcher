<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<meta name="robots" content="noindex,nofollow">

<title>RM Arcade</title>
<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Segoe UI, Arial, sans-serif;
}

#launcher {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

h1 {
    text-align: center;
    margin: 20px 0 10px 0;
}

#carouselContainer {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#carousel {
    display: flex;
    align-items: center;
    gap: 20px;
    transition: transform .25s ease;
}

.game {

    width:260px;

    opacity:.45;

    transform:scale(.75);

    transition:
        transform .25s,
        opacity .25s;

    flex-shrink:0;
}

.game.selected {

    opacity:1;

    transform:scale(1.35);
}
.game img {
    width: 100%;
    display: block;
    border-radius: 0px;
}

.title {

    text-align: center;

    margin-top: 10px;

    font-size: .9rem;

    white-space: normal;
}

.game.selected .title {

    font-size: 1.3rem;

    font-weight: bold;
}

#help {
    text-align: center;
    padding: 15px;
    opacity: .7;
}

#help label {

    font-size: 1rem;

    opacity: 0.85;

    cursor: pointer;
}

#showControls {

    width: 20px;
    height: 20px;

    vertical-align: middle;

    margin-right: 8px;
}


#player {

    display: none;

    position: fixed;

    inset: 0;

    background: black;
}

#loadingScreen {

    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:black;
    background-size:cover;
    background-position:center;

    color:white;

    font-size:2rem;
    font-weight:bold;

    text-shadow:2px 2px 8px black;

    z-index:3;
}

#gameFrame {

    position: relative;

    width: 100%;
    height: 100%;

    border: none;

    z-index: 2;
}

#backButton {

    position: fixed;

    left: 10px;
    top: 10px;

    width: 50px;
    height: 50px;

    border: none;
    border-radius: 25px;

    background: rgba(0,0,0,.7);

    color: white;

    font-size: 20px;

    z-index: 9999;
}

#fullscreenButton {

    position: fixed;

    right: 10px;
    top: 10px;

    width: 50px;
    height: 50px;

    border: none;
    border-radius: 25px;

    background: rgba(0,0,0,.7);

    color: white;

    font-size: 20px;

    z-index: 9999;
}

#marquee {

    text-align:center;

    margin:15px 0;

    font-size:3rem;

    font-weight:900;

    letter-spacing:.25em;

    text-transform:uppercase;

    color:#ffffff;

    text-shadow:
        2px 2px 0 #000,
        0 0 4px #00ffff;

    font-family:
        "Arial Black",
        Arial,
        sans-serif;
}
@keyframes neonPulse {

    0%,100% {
        text-shadow:
            0 0 5px #ff2bd6,
            0 0 10px #ff2bd6,
            0 0 20px #ff2bd6,
            0 0 40px #ff2bd6;
    }

    50% {
        text-shadow:
            0 0 8px #ff2bd6,
            0 0 15px #ff2bd6,
            0 0 30px #ff2bd6,
            0 0 60px #ff2bd6;
    }
}

</style>
</head>
<body>
<body tabindex="0">	
<button id="fullscreenButton">⛶</button>
<div id="launcher">

    <div id="marquee">
    SELECT GAME
	</div>

    <div id="carouselContainer">
        <div id="carousel"></div>
    </div>

<div id="help">

    Swipe • Arrow Keys • Enter Coin or Tap Selected Game

    <br><br>

    <label>
        <input
            type="checkbox"
            id="showControls">
        Show Touch Controls
    </label>

</div>

</div>

<div id="player">

    <div id="loadingScreen">
        Loading...
    </div>

    <button id="backButton">◀</button>



    <iframe id="gameFrame"></iframe>

</div>

<script>

let gameIds = [];

const carousel = document.getElementById("carousel");
const launcher = document.getElementById("launcher");
const player = document.getElementById("player");
const frame = document.getElementById("gameFrame");
const loading = document.getElementById("loadingScreen");

let currentIndex = 0;

function grabFocus()
{
    document.body.focus();
}

window.addEventListener("load", grabFocus);
window.addEventListener("pageshow", grabFocus);
	
function gameUrl(id)
{
    const showControls =
        document.getElementById("showControls").checked;

    let url =
        `https://arcade.makecode.com/---run?id=${id}`
        + "&fullscreen=1"
        + "&autofocus=1"
        + "&nofooter=1";

    if(!showControls)
    {
        url += "&hideSimButtons=1";
    }

    return url;
}
function thumbUrl(id)
{
    return `https://cdn.makecode.com/api/${id}/thumb`;
}

async function getTitle(id)
{
    try
    {
        const response = await fetch(
            `https://arcade.makecode.com/api/oembed?url=https://arcade.makecode.com/${id}&format=json`
        );

        const json = await response.json();

        return json.title || id;
    }
    catch
    {
        return id;
    }
}

async function loadGames()
{
    try
    {
        const response =
            await fetch("games.json");

        gameIds =
            await response.json();
    }
    catch(error)
    {
        console.error(
            "Failed to load games.json",
            error
        );
    }
}
	
async function buildCarousel()
{
    for(const game of gameIds)
    {
        const id = game.id;

        const title = await getTitle(id);

        const card = document.createElement("div");

        card.className = "game";

        card.innerHTML = `
            <img src="${thumbUrl(id)}">
            <div class="title">${title}</div>
        `;

        carousel.appendChild(card);
    }

    document
        .querySelectorAll(".game")
        .forEach((card,index) =>
        {
            card.addEventListener("click", () =>
            {
                if(index === currentIndex)
                {
                    launchGame();
                }
                else
                {
                    selectGame(index);
                }
            });
        });

    selectGame(0);
}
function selectGame(index)
{
    if(index < 0) index = 0;
    if(index >= gameIds.length) index = gameIds.length - 1;

    currentIndex = index;

    const cards = document.querySelectorAll(".game");

    cards.forEach(card =>
        card.classList.remove("selected"));

    cards[index].classList.add("selected");

    centreCarousel();
}

function centreCarousel()
{
    const cards =
        document.querySelectorAll(".game");

    const selected =
        cards[currentIndex];

    const selectedRect =
        selected.getBoundingClientRect();

    const screenCentre =
        window.innerWidth / 2;

    const selectedCentre =
        selectedRect.left +
        selectedRect.width / 2;

    const adjustment =
        screenCentre - selectedCentre;

    const matrix =
        new DOMMatrixReadOnly(
            getComputedStyle(carousel).transform
        );

    carousel.style.transform =
        `translateX(${matrix.m41 + adjustment}px)`;
}
function launchGame()
{
    document.getElementById("marquee").textContent =
        "LOADING...";

    document.getElementById("launcher").style.opacity =
        "0.5";

    setTimeout(() =>
    {
        window.location.href =
            `play.html?id=${gameIds[currentIndex].id}`;
    }, 100);
}
	
frame.onload = () =>
{
    setTimeout(() =>
    {
        loading.style.display = "none";
    }, 2500);
};

function showLauncher()
{
    frame.src = "";

    player.style.display = "none";

    launcher.style.display = "flex";
}

document
    .getElementById("backButton")
    .addEventListener("click", showLauncher);

document
    .getElementById("fullscreenButton")
    .addEventListener("click", async () =>
{
    if (!document.fullscreenElement)
    {
        await document.documentElement.requestFullscreen();
    }
    else
    {
        await document.exitFullscreen();
    }
});

document.addEventListener("keydown", e =>
{
    if(player.style.display === "block")
        return;

    const key = e.key.toLowerCase();

    // Navigate carousel
    if(key === "d")
        selectGame(currentIndex + 1);

    if(key === "a")
        selectGame(currentIndex - 1);

    // Launch selected game
    if(
        key === "z" ||
        key === "x" ||
        key === "m"
    )
    {
		console.log("Launching", gameIds[currentIndex].id);
        launchGame();
    }
});;

let touchStartX = 0;

document.addEventListener("touchstart", e =>
{
    touchStartX = e.touches[0].clientX;
});

document.addEventListener("touchend", e =>
{
    const delta =
        touchStartX -
        e.changedTouches[0].clientX;

    if(Math.abs(delta) < 50)
        return;

    if(delta > 0)
        selectGame(currentIndex + 1);
    else
        selectGame(currentIndex - 1);
});

window.addEventListener("resize", centreCarousel);

(async () =>
{
    await loadGames();
    await buildCarousel();
})();


</script>

</body>
</html>
